
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عالم الألعاب الذكية</title>
<style>
body {background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);font-family: 'Arial', sans-serif;text-align: center;color: white;padding: 20px;margin: 0;}
h1 { font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
.level-btn {background: #fff;color: #764ba2;border: none;padding: 10px 25px;font-size: 1.1em;font-weight: bold;border-radius: 20px;cursor: pointer;margin: 5px;}
.start-btn,.restart-btn {background: #ffeb3b;color: #764ba2;border: none;padding: 15px 40px;font-size: 1.3em;font-weight: bold;border-radius: 30px;cursor: pointer;margin: 20px;}
.game-board {display: none;grid-template-columns: repeat(4, 130px);gap: 20px;justify-content: center;margin: 30px auto;}
.card {width: 130px;height: 130px;background: #fff;border-radius: 20px;display: flex;align-items: center;justify-content: center;font-size: 3.5em;cursor: pointer;box-shadow: 0 6px 12px rgba(0,0,0,0.2);}
.card.flipped { background: #ffeb3b; }
#info { font-size: 1.3em; font-weight: bold; display: none; }
.restart-btn { display: none; }
.color-btn{width:80px; height:80px; border-radius:50%; margin:10px; cursor:pointer; border:3px solid #ddd; transition:0.2s}
.color-btn:hover{transform:scale(1.1)}
#result-box3{
  width:180px; height:180px; margin:20px auto; background:#ffffff;
  border-radius:20px; font-weight:bold; font-size:20px; border:4px dashed #ffcc00;
  display:flex; align-items:center; justify-content:center; color:#333;
}
.game-container{margin:40px 0;}
</style>

<h1>🎈 عالم الألعاب الذكية 🎈</h1>

<div id="levels"><p>اختاري المستوى:</p>
<button class="level-btn" onclick="setLevel(6)">سهل - 6 أزواج</button>
<button class="level-btn" onclick="setLevel(8)">صعب - 8 أزواج</button>
</div>
<button class="start-btn" onclick="startGame()">ابدأ اللعبة</button>
<div id="info"><p>النتيجة: <span id="score">0</span> | الوقت: <span id="time">0</span> ثانية</p></div>
<div class="game-board" id="gameBoard"></div>
<button class="restart-btn" onclick="startGame()">العب مرة أخرى 🔄</button>

<script>
let level = 6;let emojis = ['🍎','🍌','🍇','🍓','🍊','🍉','🥝','🍍'];let cards = [];const board = document.getElementById('gameBoard');let flippedCards = [];let score = 0;let canFlip = true;let timer = 0;let timerInterval;
function setLevel(l) {level = l;document.querySelectorAll('.level-btn').forEach(b=>b.style.background='#fff');event.target.style.background='#ffeb3b';}
function startGame() {board.innerHTML = '';flippedCards = [];score = 0;timer = 0;canFlip = true;clearInterval(timerInterval);document.getElementById('info').style.display = 'block';document.getElementById('score').innerText = 0;document.getElementById('time').innerText = 0;document.querySelector('.start-btn').style.display = 'none';document.querySelector('#levels').style.display = 'none';document.querySelector('.restart-btn').style.display = 'none';board.style.display = 'grid';let gameEmojis = emojis.slice(0, level);cards = [...gameEmojis,...gameEmojis].sort(() => Math.random() - 0.5);cards.forEach((emoji) => {const card = document.createElement('div');card.classList.add('card');card.dataset.emoji = emoji;card.innerHTML = '?';card.onclick = () => flipCard(card);board.appendChild(card);});timerInterval = setInterval(()=> {timer++;document.getElementById('time').innerText = timer;}, 1000);}
function flipCard(card) {if (!canFlip || flippedCards.length >= 2 || card.classList.contains('flipped')) return;card.classList.add('flipped');card.innerHTML = card.dataset.emoji;flippedCards.push(card);if (flippedCards.length === 2) {canFlip = false;setTimeout(checkMatch, 800);}}
function checkMatch() {if (flippedCards[0].dataset.emoji === flippedCards[1].dataset.emoji) {score++;document.getElementById('score').innerText = score;flippedCards = [];canFlip = true;if(score === level) {clearInterval(timerInterval);setTimeout(() => {alert(`مبروك كسبتي! 🎉\nالوقت: ${timer} ثانية`);document.querySelector('.restart-btn').style.display = 'inline-block';}, 300);}} else {setTimeout(() => {flippedCards.forEach(card => {card.classList.remove('flipped');card.innerHTML = '?';});flippedCards = [];canFlip = true;}, 500);}}
</script>
  
  <title>لعبة الالوان الثانوية</title>
<style>
  </body> {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

    color: white;

 .color-btn:hover{transform:scale(1.1); border-color: white;}

<body>

<h1>🎨 لعبة خلط الالوان 🎨</h1>
<p>اختاري لونين مع بعض و شوفي النتيجة</p>

<div id="colors">
  <button class="color-btn" style="background:red" data-color="red"></button>
  <button class="color-btn" style="background:yellow" data-color="yellow"></button>
  <button class="color-btn" style="background:blue" data-color="blue"></button>
  <br>
  <button class="color-btn" style="background:orange" data-color="orange"></button>
  <button class="color-btn" style="background:green" data-color="green"></button>
  <button class="color-btn" style="background:purple" data-color="purple"></button>
</div>

<div id="result-box3">النتيجة هنا</div>
<button class="reset" onclick="resetColors()">امسح و ابدأ من جديد</button>

<script>
let selected = [];

const mix = {
  "red,yellow": "برتقالي", "yellow,red": "برتقالي",
  "red,blue": "بنفسجي", "blue,red": "بنفسجي",
  "yellow,blue": "اخضر", "blue,yellow": "اخضر",
  "red,orange": "برتقالي محمر", "orange,red": "برتقالي محمر",
  "yellow,orange": "برتقالي مصفر", "orange,yellow": "برتقالي مصفر",
  "yellow,green": "اخضر مصفر", "green,yellow": "اخضر مصفر",
  "blue,green": "تركواز", "green,blue": "تركواز",
  "blue,purple": "بنفسجي مزرق", "purple,blue": "بنفسجي مزرق",
  "red,purple": "بنفسجي محمر", "purple,red": "بنفسجي محمر"
};

const colorCode = {
  "برتقالي": "#FFA500", "بنفسجي": "#8A2BE2", "اخضر": "#32CD32",
  "برتقالي محمر": "#FF4500", "برتقالي مصفر": "#FFD700",
  "اخضر مصفر": "#ADFF2F", "تركواز": "#00CED1",
  "بنفسجي مزرق": "#4B0082", "بنفسجي محمر": "#C71585"
};

document.querySelectorAll('.color-btn').forEach(btn=>{
  btn.onclick = function() {
    if(selected.length < 2){
      selected.push(this.dataset.color);
      this.style.border = "5px solid white";
      this.style.boxShadow = "0 0 20px white";
    }
    if(selected.length === 2){
      let key = selected.join(',');
      let colorName = mix[key] || "مفيش خلط للونين دول";
      let colorValue = colorCode[colorName] || "#ccc";

      document.getElementById('result-box3').style.background = colorValue;
      document.getElementById('result-box3').innerText = colorName;
      document.getElementById('result-box3').style.color = "white";
    }
  }
});
function resetColors(){
  selected = [];
  document.querySelectorAll('.color-btn').forEach(btn=> {
    btn.style.border = "4px solid #ddd";
    btn.style.boxShadow = "0 4px 8px rgba(0,0,0,0.2)";
  });
  document.getElementById('result-box3').style.background = "#ffffff";
  document.getElementById('result-box3').innerText = "النتيجة هنا";
  document.getElementById('result-box3').style.color = "#333";
}
</script>
  <hr style="margin:50px 0; border:2px dashed #ffcc00;">
<h2 style="text-align:center;">🍓 لعبة الذاكرة بالمراحل 🍓</h2>

<div id="memory-levels-game" style="text-align:center;">
  <button onclick="startLevel(6)">المستوى 1: 6 ازواج</button>
  <button onclick="startLevel(8)">المستوى 2: 8 ازواج</button>
  <button onclick="startLevel(10)">المستوى 3: 10 ازواج</button>
  <div id="level-board" class="board"></div>
  <p id="level-status" style="font-size:20px; font-weight:bold;"></p>
</div>

<style>
#memory-levels-game button{padding:10px 20px; margin:5px; font-size:16px; background:#ffcc00; border:none; border-radius:10px; cursor:pointer;}
#memory-levels-game .board{display:grid; gap:10px; justify-content:center; margin:20px auto;}
#memory-levels-game .card{width:80px; height:80px; background:#fff; border:3px solid #ffcc00; border-radius:15px; font-size:40px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
#memory-levels-game .card.flipped{background:#ffeeba;}
#memory-levels-game .card.matched{background:#90ee90; cursor:default;}
</style>

<script>
const allFruits = ['🍓','🍎','🍌','🍇','🍉','🍊','🥝','🍑','🍍','🥭']; // 10 فواكه
let levelBoard = document.getElementById('level-board');
let levelStatus = document.getElementById('level-status');
let levelCards = [];
let levelFlipped = [];
let levelCanFlip = false;

function startLevel(pairs){
  levelBoard.innerHTML = '';
  levelCards = [];
  levelFlipped = [];
  levelCanFlip = false;
  
  // نحدد عدد الاعمدة حسب عدد الازواج
  let cols = pairs <= 6 ? 4 : pairs <= 8 ? 4 : 5;
  levelBoard.style.gridTemplateColumns = `repeat(${cols}, 80px)`;
  
  // نختار الفواكه حسب المرحلة ونكررها
  let selected = allFruits.slice(0, pairs);
  let items = [...selected, ...selected].sort(()=>Math.random()-0.5);
  
  items.forEach((item)=>{
    let card = document.createElement('div');
    card.className = 'card';
    card.dataset.item = item;
    card.innerText = item; // معاينة
    card.onclick = flipLevelCard;
    levelBoard.appendChild(card);
    levelCards.push(card);
  });

  levelStatus.innerText = 'احفظي اماكن الفواكه...';
  // بعد 3 ثواني نقلب
  setTimeout(()=>{
    levelCards.forEach(c=> c.innerText = '?');
    levelStatus.innerText = 'يلا ابدئي';
    levelCanFlip = true;
  }, 3000);
}

function flipLevelCard(){
  if(!levelCanFlip || this.classList.contains('flipped') || this.classList.contains('matched')) return;
  
  this.innerText = this.dataset.item;
  this.classList.add('flipped');
  levelFlipped.push(this);

  if(levelFlipped.length === 2){
    levelCanFlip = false;
    setTimeout(checkLevelMatch, 600);
  }
}

function checkLevelMatch(){
  let [c1, c2] = levelFlipped;
  if(c1.dataset.item === c2.dataset.item){
    c1.classList.add('matched');
    c2.classList.add('matched');
    // فوز
    if(document.querySelectorAll('#memory-levels-game .matched').length === levelCards.length){
      levelStatus.innerText = '🎉 برافووو خلصتي المرحلة 🎉';
    }
  } else {
    c1.innerText = '?';
    c2.innerText = '?';
    c1.classList.remove('flipped');
    c2.classList.remove('flipped');
  }
  levelFlipped = [];
  levelCanFlip = true;
}
</script>
