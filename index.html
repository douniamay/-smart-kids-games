
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عالم الألعاب الذكية</title>
<style>
body {background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);font-family: 'Arial', sans-serif;text-align: center;color: white;padding: 20px;margin: 0;}
h1 { font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
.level-btn {background: #fff;color: #764ba2;border: none;padding: 10px 25px;font-size: 1.1em;font-weight: bold;border-radius: 20px;cursor: pointer;margin: 5px;}
.start-btn,.restart-btn {background: #ffeb3b;color: #764ba2;border: none;padding: 15px 40px;font-size: 1.3em;font-weight: bold;border-radius: 30px;cursor: pointer;margin: 20px;}
.game-board {display: none;grid-template-columns: repeat(4, 130px);gap: 20px;justify-content: center;margin: 30px auto;}
.card {width: 130px;height: 130px;background: #fff;border-radius: 20px;display: flex;align-items: center;justify-content: center;font-size: 3.5em;cursor: pointer;box-shadow: 0 6px 12px rgba(0,0,0,0.2);}
.card.flipped { background: #ffeb3b; }
#info { font-size: 1.3em; font-weight: bold; display: none; }
.restart-btn { display: none; }
</style>
</head>
<body>
<h1>🎈 عالم الألعاب الذكية 🎈</h1>
<div id="levels"><p>اختاري المستوى:</p><button class="level-btn" onclick="setLevel(6)">سهل - 6 أزواج</button><button class="level-btn" onclick="setLevel(8)">صعب - 8 أزواج</button></div>
<button class="start-btn" onclick="startGame()">ابدأ اللعبة</button>
<div id="info"><p>النتيجة: <span id="score">0</span> | الوقت: <span id="time">0</span> ثانية</p></div>
<div class="game-board" id="gameBoard"></div>
<button class="restart-btn" onclick="startGame()">العب مرة أخرى 🔄</button>
<script>
    let selected3 = [];
    const mix3 = {
      "red,orange": "red-orange", "orange,red": "red-orange",
      "red,purple": "red-purple", "purple,red": "red-purple",
      "yellow,orange": "yellow-orange", "orange,yellow": "yellow-orange",
      "yellow,green": "yellow-green", "green,yellow": "yellow-green",
      "blue,green": "blue-green", "green,blue": "blue-green",
      "blue,purple": "blue-purple", "purple,blue": "blue-purple"
    };

    const colorCode = {
      "red-orange": "#FF4500", "red-purple": "#C71585",
      "yellow-orange": "#FFA500", "yellow-green": "#ADFF2F",
      "blue-green": "#00CED1", "blue-purple": "#8A2BE2"
    };

    document.querySelectorAll('#primary-colors.color-btn, #secondary-colors.color-btn').forEach(btn=>{
      btn.onclick = () => {
        if(selected3.length < 2){
          selected3.push(btn.dataset.color);
          btn.style.border = "4px solid black";
          btn.style.opacity = "0.7";
        }
        if(selected3.length === 2){
          let key = selected3.join(',');
          let colorName = mix3[key] || "غير متاح";
          let colorValue = colorCode[colorName] || "#ccc";
          document.getElementById('result-box3').style.background = colorValue;
          document.getElementById('result-box3').innerText = colorName;
          document.getElementById('result-box3').style.color = "#fff";
        }
      }
    });

    function resetColors3(){
      selected3 = [];
      document.querySelectorAll('#primary-colors.color-btn, #secondary-colors.color-btn').forEach(btn=> {
        btn.style.border = "3px solid #ddd";
        btn.style.opacity = "1";
      });
      document.getElementById('result-box3').style.background = "#ffffff";
      document.getElementById('result-box3').innerText = "النتيجة هنا";
      document.getElementById('result-box3').style.color = "#333";
    }
    </script>
<style>
.color-btn{width:80px; height:80px; border-radius:50%; margin:10px; cursor:pointer; border:none}
#result-box{width:150px; height:150px; margin:20px auto; background:#eee; display:flex; align-items:center; justify-content:center; border-radius:15px; font-weight:bold}
</style>
    
<h1>🎨 لعبة الالوان الثلاثية 🎨</h1>
<p>اختاري لون اساسي + لون ثانوي</p>

<h3>الوان الاساسية</h3>
<div id="primary-colors">
<button class="color-btn" style="background:red" data-color="red"></button>
<button class="color-btn" style="background:yellow" data-color="yellow"></button>
<button class="color-btn" style="background:blue" data-color="blue"></button>
</div>

<h3>الالوان الثانوية</h3>
<div id="secondary-colors">
<button class="color-btn" style="background:orange" data-color="orange"></button>
<button class="color-btn" style="background:green" data-color="green"></button>
<button class="color-btn" style="background:purple" data-color="purple"></button>
</div>

<div id="result-box3">النتيجة هنا</div>
<button onclick="resetColors3()">امسح</button>

<script>
// الكود هنا تحت الـ HTML عشان يلاقي الازرار
let selected3 = [];
const mix3 = {
  "red,orange": "برتقالي", "orange,red": "برتقالي",
  "red,purple": "بنفسجي", "purple,red": "بنفسجي",
  "yellow,orange": "برتقالي مصفر", "orange,yellow": "برتقالي مصفر",
  "yellow,green": "اخضر مصفر", "green,yellow": "اخضر مصفر",
  "blue,green": "تركواز", "green,blue": "تركواز",
  "blue,purple": "بنفسجي مزرق", "purple,blue": "بنفسجي مزرق"
};
const colorCode = {
  "برتقالي": "#FF4500", "بنفسجي": "#C71585",
  "برتقالي مصفر": "#FFA500", "اخضر مصفر": "#ADFF2F",
  "تركواز": "#00CED1", "بنفسجي مزرق": "#8A2BE2"
};

document.querySelectorAll('#primary-colors.color-btn, #secondary-colors.color-btn').forEach(btn=>{
  btn.onclick = function() {
    if(selected3.length < 2){
      selected3.push(this.dataset.color);
      this.style.border = "5px solid white";
    }
    if(selected3.length === 2){
      let key = selected3.join(',');
      let colorName = mix3[key] || "اللون غير موجود";
      let colorValue = colorCode[colorName] || "#ccc";

      document.getElementById('result-box3').style.background = colorValue;
      document.getElementById('result-box3').innerText = colorName;
      document.getElementById('result-box3').style.color = "white";
    }
  }
});

function resetColors3(){
  selected3 = [];
  document.querySelectorAll('#primary-colors.color-btn, #secondary-colors.color-btn').forEach(btn=> {
    btn.style.border = "3px solid #ddd";
  });
  document.getElementById('result-box3').style.background = "#ffffff";
  document.getElementById('result-box3').innerText = "النتيجة هنا";
  document.getElementById('result-box3').style.color = "#333";
}
</script>
<style>
.color-btn{width:80px; height:80px; border-radius:50%; margin:8px; cursor:pointer; border:3px solid #ddd}
#result-box3{
  width:180px;
  height:180px;
  margin:20px auto;
  background:#ffffff;
  border-radius:20px;
  font-weight:bold;
  font-size:20px;
  border:4px dashed #ffcc00;
  text-align:center;
  line-height:180px;
  color:#333;
}
</style>
    
</body>
</html>
