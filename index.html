
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عالم الألعاب الذكية</title>
<style>
body {background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);font-family: 'Arial', sans-serif;text-align: center;color: white;padding: 20px;margin: 0;}
h1 { font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
.level-btn {background: #fff;color: #764ba2;border: none;padding: 10px 25px;font-size: 1.1em;font-weight: bold;border-radius: 20px;cursor: pointer;margin: 5px;}
.start-btn,.restart-btn {background: #ffeb3b;color: #764ba2;border: none;padding: 15px 40px;font-size: 1.3em;font-weight: bold;border-radius: 30px;cursor: pointer;margin: 20px;}
.game-board {display: none;grid-template-columns: repeat(4, 130px);gap: 20px;justify-content: center;margin: 30px auto;}
.card {width: 130px;height: 130px;background: #fff;border-radius: 20px;display: flex;align-items: center;justify-content: center;font-size: 3.5em;cursor: pointer;box-shadow: 0 6px 12px rgba(0,0,0,0.2);}
.card.flipped { background: #ffeb3b; }
#info { font-size: 1.3em; font-weight: bold; display: none; }
.restart-btn { display: none; }
</style>
</head>
<body>
<h1>🎈 عالم الألعاب الذكية 🎈</h1>
<div id="levels"><p>اختاري المستوى:</p><button class="level-btn" onclick="setLevel(6)">سهل - 6 أزواج</button><button class="level-btn" onclick="setLevel(8)">صعب - 8 أزواج</button></div>
<button class="start-btn" onclick="startGame()">ابدأ اللعبة</button>
<div id="info"><p>النتيجة: <span id="score">0</span> | الوقت: <span id="time">0</span> ثانية</p></div>
<div class="game-board" id="gameBoard"></div>
<button class="restart-btn" onclick="startGame()">العب مرة أخرى 🔄</button>
<script>
let level = 6;let emojis = ['🍎','🍌','🍇','🍓','🍊','🍉','🥝','🍍'];let cards = [];const board = document.getElementById('gameBoard');let flippedCards = [];let score = 0;let canFlip = true;let timer = 0;let timerInterval;
function setLevel(l) {level = l;document.querySelectorAll('.level-btn').forEach(b=>b.style.background='#fff');event.target.style.background='#ffeb3b';}
function startGame() {board.innerHTML = '';flippedCards = [];score = 0;timer = 0;canFlip = true;clearInterval(timerInterval);document.getElementById('info').style.display = 'block';document.getElementById('score').innerText = 0;document.getElementById('time').innerText = 0;document.querySelector('.start-btn').style.display = 'none';document.querySelector('#levels').style.display = 'none';document.querySelector('.restart-btn').style.display = 'none';board.style.display = 'grid';let gameEmojis = emojis.slice(0, level);cards = [...gameEmojis,...gameEmojis].sort(() => Math.random() - 0.5);cards.forEach((emoji) => {const card = document.createElement('div');card.classList.add('card');card.dataset.emoji = emoji;card.innerHTML = '?';card.onclick = () => flipCard(card);board.appendChild(card);});timerInterval = setInterval(()=> {timer++;document.getElementById('time').innerText = timer;}, 1000);}
function flipCard(card) {if (!canFlip || flippedCards.length >= 2 || card.classList.contains('flipped')) return;card.classList.add('flipped');card.innerHTML = card.dataset.emoji;flippedCards.push(card);if (flippedCards.length === 2) {canFlip = false;setTimeout(checkMatch, 800);}}
function checkMatch() {if (flippedCards[0].dataset.emoji === flippedCards[1].dataset.emoji) {score++;document.getElementById('score').innerText = score;flippedCards = [];canFlip = true;if(score === level) {clearInterval(timerInterval);setTimeout(() => {alert(`مبروك كسبتي! 🎉\nالوقت: ${timer} ثانية`);document.querySelector('.restart-btn').style.display = 'inline-block';}, 300);}} else {setTimeout(() => {flippedCards.forEach(card => {card.classList.remove('flipped');card.innerHTML = '?';});flippedCards = [];canFlip = true;}, 500);}}
</script>


  
<!-- لعبة دمج الالوان -->
<div class="game-container">
  <h2>🎨 لعبة دمج الالوان</h2>
  <p>دوسي على لونين عشان ندمجهم</p>

  <div id="colors">
    <button class="color-btn" style="background:red" data-color="red"></button>
    <button class="color-btn" style="background:yellow" data-color="yellow"></button>
    <button class="color-btn" style="background:blue" data-color="blue"></button>
  </div>

  <div id="result-box">النتيجة هنا</div>
  <button onclick="resetColors()">امسح</button>
</div>

<script>
let selected = [];

const mix = {
  "red,yellow": "orange",
  "yellow,red": "orange",
  "blue,yellow": "green",
  "yellow,blue": "green",
  "red,blue": "purple",
  "blue,red": "purple"
};

document.querySelectorAll('.color-btn').forEach(btn=>{
  btn.onclick = () => {
    if(selected.length < 2){
      selected.push(btn.dataset.color);
      btn.style.border = "4px solid black";
    }
    if(selected.length === 2){
      let key = selected.join(',');
      let newColor = mix[key] || "gray";
      document.getElementById('result-box').style.background = newColor;
      document.getElementById('result-box').innerText = "واااو طلع " + newColor;
    }
  }
});

function resetColors(){
  selected = [];
  document.querySelectorAll('.color-btn').forEach(btn=> btn.style.border = "none");
  document.getElementById('result-box').style.background = "#eee";
  document.getElementById('result-box').innerText = "النتيجة هنا";
}
</script>
<style>
.color-btn{width:80px; height:80px; border-radius:50%; margin:8px; cursor:pointer; border:3px solid #ddd}
#result-box3{
  width:200px; 
  height:200px; 
  margin:20px auto; 
  background:#eee; 
  display:flex; 
  align-items:center; 
  justify-content:center; 
  border-radius:20px; 
  font-weight:bold; 
  font-size:18px;
  border:4px dashed #999;
  text-align:center;
  color:#333;
}
</style>

<!-- لعبة الالوان الثلاثية -->
<div class="game-container">
  <h2>🎨 لعبة الالوان الثلاثية</h2>
  <p>اختاري لون اساسي + لون ثانوي</p>

  <h4>الالوان الاساسية</h4>
  <div id="primary-colors">
    <button class="color-btn" style="background:red" data-color="red" title="احمر"></button>
    <button class="color-btn" style="background:yellow" data-color="yellow" title="اصفر"></button>
    <button class="color-btn" style="background:blue" data-color="blue" title="ازرق"></button>
  </div>

  <h4>الالوان الثانوية</h4>
  <div id="secondary-colors">
    <button class="color-btn" style="background:orange" data-color="orange" title="برتقالي"></button>
    <button class="color-btn" style="background:green" data-color="green" title="اخضر"></button>
    <button class="color-btn" style="background:purple" data-color="purple" title="بنفسجي"></button>
  </div>

  <div id="result-box3">النتيجة هنا</div>
  <button onclick="resetColors3()">امسح</button>
</div>

<script>
let selected3 = [];

const mix3 = {
  "red,orange": "red-orange",
  "orange,red": "red-orange",
  "red,purple": "red-purple",
  "purple,red": "red-purple",
  "yellow,orange": "yellow-orange",
  "orange,yellow": "yellow-orange",
  "yellow,green": "yellow-green",
  "green,yellow": "yellow-green",
  "blue,green": "blue-green",
  "green,blue": "blue-green",
  "blue,purple": "blue-purple",
  "purple,blue": "blue-purple"
};

const colorCode = {
  "red-orange": "#FF4500",
  "red-purple": "#C71585",
  "yellow-orange": "#FFA500",
  "yellow-green": "#ADFF2F",
  "blue-green": "#00CED1",
  "blue-purple": "#8A2BE2"
};

document.querySelectorAll('#primary-colors.color-btn, #secondary-colors.color-btn').forEach(btn=>{
  btn.onclick = () => {
    if(selected3.length < 2){
      selected3.push(btn.dataset.color);
      btn.style.border = "4px solid black";
    }
    if(selected3.length === 2){
      let key = selected3.join(',');
      let colorName = mix3[key] || "غير متاح";
      let colorValue = colorCode[colorName] || "#ccc";

      document.getElementById('result-box3').style.background = colorValue;
      document.getElementById('result-box3').innerText = colorName;
    }
  }
});

function resetColors3(){
  selected3 = [];
  document.querySelectorAll('#primary-colors.color-btn, #secondary-colors.color-btn').forEach(btn=> btn.style.border = "none");
  document.getElementById('result-box3').style.background = "#eee";
  document.getElementById('result-box3').innerText = "النتيجة هنا";
}
</script>
<style>
.color-btn{width:80px; height:80px; border-radius:50%; margin:8px; cursor:pointer; border:3px solid #ddd}
#result-box3{
  width:200px; 
  height:200px; 
  margin:20px auto; 
  background:#eee; 
  display:flex; 
  align-items:center; 
  justify-content:center; 
  border-radius:20px; 
  font-weight:bold; 
  font-size:18px;
  border:4px dashed #999;
  text-align:center;
  color:#333;
}
</style>

</body>
</html>
